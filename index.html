
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi To-Do List</title>

    <link rel="stylesheet" href="style.css">

    <!-- Memastikan JavaScript dijalankan setelah HTML dibaca -->
    <script src="script.js" defer></script>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
    <source src="VIDIO.mp4" type="video/mp4">
    </video>

<div class="video-overlay"></div>


    <div class="container">

        <header>
            <h1>Mpew List</h1>
            <p>Kelola kegiatan dan pekerjaan hari ini</p>
        </header>

        <main>

            <section class="input-section">
                <input
                    type="text"
                    id="inputTugas"
                    placeholder="Masukkan Tugas Baru..."
                    autocomplete="off"
                >
                <button id="tombolTambah">Tambah</button>
            </section>

            <section class="statistik">
                <div class="stat-box">
                    <h3 id="jumlahSemua">0</h3>
                    <p>Total tugas</p>
                </div>

                <div class="stat-box">
                    <h3 id="jumlahSelesai">0</h3>
                    <p>Selesai</p>
                </div>

                <div class="stat-box">
                    <h3 id="jumlahBelum">0</h3>
                    <p>Belum selesai</p>
                </div>
            </section>

            <section class="task-section">
                <h2>Daftar Kegiatan</h2>

                <ul id="daftarTugas"></ul>

                <p id="pesanKosong">Tidak ada tugas</p>
            </section>

            <button id="tombolHapusSemua" class="hapus-semua">
                Hapus Semua Tugas
            </button>

        </main>

        <footer>
            <p>&copy; 2026 Aplikasi To-Do List</p>
        </footer>

    </div>

</body>
</html>
